name: code style

permissions:
  contents: read

on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".editorconfig"
      - ".gitattributes"
      - ".github/CONTRIBUTING.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".gitignore"
      - "LICENSE.md"
      - "README.md"
      - "CHANGELOG.md"

  push: *ignore-paths

jobs:
  php-cs-fixer:
    uses: yiisoft/yii2-actions/.github/workflows/php-cs-fixer.yml@master
    with:
      configuration: .php-cs-fixer.dist.php
      php-version: "[8.1]"
