permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'infection.json.dist'
      - 'phpstan.neon'

  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'infection.json.dist'
      - 'phpstan.neon'

name: build

jobs:
  phpunit:
    uses: yiisoft/yii2-actions/.github/workflows/phpunit.yml@master
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      extensions: gd, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.1, 8.2, 8.3, 8.4, 8.5, 8.6]"
